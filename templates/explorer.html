<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>40,000 FT — Decode Explorer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='explorer/app.css') }}">
</head>
<body>
  <div class="hud">
    <header class="hud-top">
      <div class="brand">
        <span class="live">LIVE</span>
        <strong>40KFT</strong>
        <span class="dim">DECODE-SWARM-01</span>
      </div>
      <div id="metrics" class="metrics"></div>
      <label class="search">
        <span class="sr-only">Search decodes</span>
        <input id="search" type="search" placeholder="SEARCH LABELS / KEYWORDS / TWEET ID" autocomplete="off">
      </label>
      <div class="view-toggle" role="group" aria-label="Layout">
        <button id="view-constellation" class="active" type="button">SWARM</button>
        <button id="view-timeline" type="button">TIMELINE</button>
      </div>
      <div class="actions">
        <button id="btn-sync" type="button">SYNC X</button>
        <label class="file-btn">
          IMPORT ARCHIVE
          <input id="archive-file" type="file" accept=".zip,.js">
        </label>
        <a class="ghost" href="/classic">CLASSIC</a>
      </div>
    </header>

    <main class="viewport">
      <canvas id="stage"></canvas>
      <div id="float-label" class="float-label hidden"></div>
      <div id="empty-state" class="empty hidden"></div>
    </main>

    <footer class="hud-bottom">
      <section class="panel">
        <h2>RUN LOG</h2>
        <div id="run-log" class="log"></div>
      </section>
      <section class="panel">
        <h2>THEME LOAD</h2>
        <canvas id="theme-bars" height="110"></canvas>
      </section>
      <section class="panel">
        <h2>BLAST RADIUS</h2>
        <canvas id="radar" height="110"></canvas>
      </section>
      <section class="panel">
        <h2>ACTION HEAT</h2>
        <canvas id="heat" height="110"></canvas>
      </section>
      <section class="panel inspect-panel">
        <h2>INSPECT</h2>
        <div id="inspector" class="inspect">
          <p class="dim">Select a node. Neighborhood edges light; the rest stay in the fog.</p>
        </div>
      </section>
    </footer>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="{{ url_for('static', filename='explorer/app.js') }}"></script>
</body>
</html>
